# Vivid Life Theme — Noon · Red — custom prompt
# Generated — do not edit by hand. Source: https://github.com/vivid-life-theme/vivid-life-starship
# Requires a Nerd Font (recommended: Atkinson Hyperlegible Mono Nerd Font — https://www.nerdfonts.com/font-downloads)

format = """
$directory$git_branch$git_status$nodejs$python$rust$golang$java$docker_context$cmd_duration$fill$time
$character"""

command_timeout = 1000
palette = "vivid_life"

[palettes.vivid_life]
bg = "#f5f5f5"
bg_soft = "#ffffff"
fg = "#171717"
fg_muted = "#404040"
accent = "#b91c1c"
success = "#365314"
warning = "#713f12"
danger = "#7f1d1d"
info = "#1e3a8a"
red = "#b91c1c"
orange = "#c2410c"
yellow = "#713f12"
green = "#365314"
blue = "#1d4ed8"
purple = "#7e22ce"

[directory]
style = "bold accent"

[git_branch]
style = "fg_muted"

[git_status]
style = "fg_muted"
conflicted = "[=$count](warning)"
ahead = "[⇡$count](fg_muted)"
behind = "[⇣$count](fg_muted)"
diverged = "[⇕⇡$ahead_count⇣$behind_count](fg_muted)"
untracked = "[?$count](success)"
stashed = "[\\$$count](fg_muted)"
modified = "[!$count](info)"
staged = "[+$count](warning)"
renamed = "[»$count](info)"
deleted = "[✘$count](danger)"

[cmd_duration]
style = "warning"
format = "[$duration]($style) "

[fill]
style = "fg_muted"
symbol = " "

[time]
disabled = false
style = "fg_muted"
format = "[$time]($style)"

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](danger)"

[nodejs]
style = "green"
format = "[$symbol$version]($style) "

[python]
style = "yellow"
format = "[$symbol$version]($style) "

[rust]
style = "orange"
format = "[$symbol$version]($style) "

[golang]
style = "blue"
format = "[$symbol$version]($style) "

[java]
style = "red"
format = "[$symbol$version]($style) "

[docker_context]
style = "purple"
format = "[$symbol$version]($style) "
