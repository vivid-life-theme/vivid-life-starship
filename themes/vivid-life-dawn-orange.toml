fg = "#171717"
fg_muted = "#404040"
accent = "#7c2d12"
success = "#365314"
warning = "#713f12"
danger = "#7f1d1d"
info = "#1e3a8a"
red = "#7f1d1d"
orange = "#7c2d12"
yellow = "#713f12"
green = "#365314"
blue = "#1d4ed8"
