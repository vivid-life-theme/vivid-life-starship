# Vivid Life Theme — Twilight · Red — custom prompt
# Generated — do not edit by hand. Source: https://github.com/vivid-life-theme/vivid-life-starship
# Requires a Nerd Font (recommended: Atkinson Hyperlegible Mono Nerd Font — https://www.nerdfonts.com/font-downloads)

format = """
$directory$git_branch$git_status$nodejs$python$rust$golang$java$docker_context$cmd_duration$fill$time
$character"""

command_timeout = 1000
palette = "vivid_life"

[palettes.vivid_life]
bg = "#404040"
bg_soft = "#525252"
fg = "#f5f5f5"
fg_muted = "#d4d4d4"
accent = "#fca5a5"
success = "#bef264"
warning = "#fef9c3"
danger = "#fee2e2"
info = "#dbeafe"
red = "#fca5a5"
orange = "#fdba74"
yellow = "#eab308"
green = "#84cc16"
blue = "#93c5fd"
purple = "#d8b4fe"

[directory]
style = "bold accent"

[git_branch]
style = "fg_muted"

[git_status]
style = "fg_muted"
conflicted = "[=$count](warning)"
ahead = "[⇡$count](fg_muted)"
behind = "[⇣$count](fg_muted)"
diverged = "[⇕⇡$ahead_count⇣$behind_count](fg_muted)"
untracked = "[?$count](success)"
stashed = "[\\$$count](fg_muted)"
modified = "[!$count](info)"
staged = "[+$count](warning)"
renamed = "[»$count](info)"
deleted = "[✘$count](danger)"

[cmd_duration]
style = "warning"
format = "[$duration]($style) "

[fill]
style = "fg_muted"
symbol = " "

[time]
disabled = false
style = "fg_muted"
format = "[$time]($style)"

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](danger)"

[nodejs]
style = "green"
format = "[$symbol$version]($style) "

[python]
style = "yellow"
format = "[$symbol$version]($style) "

[rust]
style = "orange"
format = "[$symbol$version]($style) "

[golang]
style = "blue"
format = "[$symbol$version]($style) "

[java]
style = "red"
format = "[$symbol$version]($style) "

[docker_context]
style = "purple"
format = "[$symbol$version]($style) "
